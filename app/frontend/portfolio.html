<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDSCR_BE // CREATOR_ARCHIVES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #09090b; /* zinc-950 */
            color: #e4e4e7; /* zinc-200 */
        }

        .terminal-cursor::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .glitch-effect {
            animation: glitch 0.2s cubic-bezier(.25, .46, .45, .94) both infinite;
            color: #22c55e;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        .card-hover:hover {
            border-color: rgba(34, 197, 94, 0.5);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-black z-50 flex flex-col justify-center items-center p-8 text-green-500">
        <div class="w-full max-w-2xl">
            <div class="mb-4 flex items-center gap-2">
                <i data-lucide="terminal" class="h-6 w-6"></i>
                <span class="text-xl font-bold">MINDSCR_BE DEV_CONSOLE v2.0</span>
            </div>
            <div class="bg-zinc-900 border border-green-500/30 p-6 rounded-lg shadow-[0_0_20px_rgba(34,197,94,0.2)] min-h-[300px] font-mono text-sm md:text-base">
                <div id="terminal-logs"></div>
                <div class="terminal-cursor mt-2"></div>
            </div>
        </div>
    </div>

    <!-- Main Content (Hidden initially) -->
    <div id="main-content" class="hidden min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="border-b border-zinc-800 bg-zinc-950/80 backdrop-blur sticky top-0 z-40">
            <div class="container mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2 text-green-500">
                    <i data-lucide="terminal" class="h-5 w-5"></i>
                    <span class="font-bold tracking-wider">CREATOR_ARCHIVES</span>
                </div>
                <button onclick="window.location.href='/'" class="flex items-center gap-2 text-zinc-400 hover:text-white transition-colors px-4 py-2 rounded hover:bg-zinc-900">
                    <span>[ 退出模式 ]</span>
                </button>
            </div>
        </header>

        <!-- Content -->
        <main class="container mx-auto px-4 py-12 flex-grow">
            <div class="mb-12 text-center">
                <h1 class="text-4xl md:text-6xl font-bold mb-4 bg-gradient-to-r from-green-400 to-emerald-600 bg-clip-text text-transparent">
                    PROJECT_MANIFEST
                </h1>
                <p class="text-zinc-400 max-w-2xl mx-auto font-mono">
                    // A collection of hardware, software, and robotic systems designed and engineered by the creator.
                </p>
            </div>

            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Projects will be injected here by JS -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="border-t border-zinc-800 mt-20 py-8 text-center text-zinc-500 font-mono text-sm">
            <p>SYSTEM_STATUS: ONLINE | SECURE_CONNECTION_ESTABLISHED</p>
            <p class="mt-2">© 2026 MINDSCR_BE LABS</p>
        </footer>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Project Data
        const projects = [
            {
                id: 'salvage-ship',
                title: '打捞船软硬件设计',
                description: '针对水下作业环境设计的综合打捞系统，包含船体结构、动力系统及控制软件设计。',
                icon: 'anchor',
                tags: ['Hardware', 'Embedded', 'Control'],
                doc: '/static/portfolio/salvage_ship_design.doc',
                video: null
            },
            {
                id: 'smart-alarm',
                title: '智能闹钟软硬件设计',
                description: '基于用户行为分析的智能唤醒系统，集成环境监测与睡眠周期追踪功能。',
                icon: 'clock',
                tags: ['IoT', 'Embedded', 'Product Design'],
                doc: '/static/portfolio/smart_alarm_clock_report.docx',
                video: '/static/portfolio/smart_alarm_clock_demo.mp4'
            },
            {
                id: 'unity-game',
                title: 'Unity 游戏设计：校务小能手',
                description: '基于 Unity 引擎开发的校园模拟经营游戏，包含完整的游戏机制设计与关卡逻辑。',
                icon: 'gamepad-2',
                tags: ['Unity', 'C#', 'Game Design'],
                doc: '/static/portfolio/unity_game_design.pdf',
                video: null
            },
            {
                id: 'candy-robot',
                title: '糖豆分拣机器人',
                description: '利用机器视觉识别颜色并进行自动分拣的机器人系统，实现高精度快速分拣。',
                icon: 'bot',
                tags: ['Robotics', 'Computer Vision', 'Automation'],
                doc: '/static/portfolio/candy_sorting_robot.pdf',
                video: null
            },
            {
                id: 'robot-dog',
                title: '机器狗展示',
                description: '四足机器人运动控制算法演示，展示了在复杂地形下的平衡与移动能力。',
                icon: 'bot',
                tags: ['Robotics', 'Motion Control', 'Demo'],
                doc: null,
                video: '/static/portfolio/robot_dog_demo.mp4'
            },
            {
                id: 'hsr-beam',
                title: '高铁信号波束控制',
                description: '针对高速铁路通信场景的波束成形与信号控制算法研究，提升通信稳定性。',
                icon: 'wifi',
                tags: ['Signal Processing', 'Communication', 'Algorithm'],
                doc: '/static/portfolio/hsr_beam_control.docx',
                video: null
            },
            {
                id: '5axis-robot',
                title: '五轴并联多连杆机器人',
                description: '高自由度并联机械臂设计，适用于精密装配与复杂轨迹追踪任务。',
                icon: 'cpu',
                tags: ['Robotics', 'Kinematics', 'Mechanical Design'],
                doc: '/static/portfolio/5axis_robot_design.docx',
                video: '/static/portfolio/5axis_robot_demo.mp4'
            },
            {
                id: 'control-sim',
                title: '控制仿真分析',
                description: '复杂系统的数学建模与控制策略仿真分析，验证控制算法的有效性与鲁棒性。',
                icon: 'activity',
                tags: ['Simulation', 'Matlab/Simulink', 'Control Theory'],
                doc: '/static/portfolio/control_simulation_analysis.docx',
                video: null
            }
        ];

        // Render Projects
        const grid = document.getElementById('projects-grid');
        projects.forEach(project => {
            const card = document.createElement('div');
            card.className = 'bg-zinc-900/50 border border-zinc-800 rounded-xl overflow-hidden card-hover transition-all duration-300 flex flex-col';
            
            let mediaContent = '';
            if (project.video) {
                mediaContent = `
                    <div class="mt-4 rounded-md overflow-hidden border border-zinc-800 bg-black aspect-video relative">
                        <video src="${project.video}" controls class="w-full h-full object-cover"></video>
                    </div>
                `;
            }

            let actionButton = '';
            if (project.doc) {
                actionButton = `
                    <a href="${project.doc}" target="_blank" class="flex-1 flex items-center justify-center gap-2 bg-transparent border border-zinc-700 hover:bg-zinc-800 hover:text-green-400 text-zinc-300 py-2 rounded transition-colors text-sm font-medium">
                        <i data-lucide="file-text" class="h-4 w-4"></i>
                        View Doc
                    </a>
                `;
            } else if (project.video) {
                actionButton = `
                    <button disabled class="flex-1 flex items-center justify-center gap-2 bg-transparent border border-zinc-800 text-zinc-600 py-2 rounded cursor-not-allowed text-sm font-medium">
                        <i data-lucide="file-text" class="h-4 w-4"></i>
                        No Doc
                    </button>
                `;
            }

            const tagsHtml = project.tags.slice(0, 2).map(tag => 
                `<span class="text-[10px] border border-zinc-700 text-zinc-400 px-2 py-0.5 rounded-full">${tag}</span>`
            ).join('');

            card.innerHTML = `
                <div class="p-6 flex-grow">
                    <div class="flex justify-between items-start mb-4">
                        <div class="p-2 bg-zinc-800 rounded-lg text-green-400">
                            <i data-lucide="${project.icon}" class="h-6 w-6"></i>
                        </div>
                        <div class="flex gap-1 flex-wrap justify-end">
                            ${tagsHtml}
                        </div>
                    </div>
                    <h3 class="text-xl font-bold text-zinc-100 mb-2 group-hover:text-green-400">${project.title}</h3>
                    <p class="text-zinc-400 text-sm leading-relaxed h-20 overflow-hidden">${project.description}</p>
                    ${mediaContent}
                </div>
                <div class="p-6 pt-0 mt-auto flex gap-2">
                    ${actionButton}
                </div>
            `;
            grid.appendChild(card);
        });
        lucide.createIcons(); // Re-run for dynamic content

        // Animation Logic
        const logsContainer = document.getElementById('terminal-logs');
        const loadingScreen = document.getElementById('loading-screen');
        const mainContent = document.getElementById('main-content');
        
        const sequence = [
            { text: '> INITIALIZING SECURE CONNECTION...', delay: 500 },
            { text: '> ACCESSING CREATOR ARCHIVES...', delay: 1200 },
            { text: '> DECRYPTING PROJECT FILES...', delay: 2000 },
            { text: '> LOADING ASSETS: [####################] 100%', delay: 2800 },
            { text: '> SYSTEM READY.', delay: 3500 }
        ];

        let currentTime = 0;
        sequence.forEach(({ text, delay }) => {
            setTimeout(() => {
                const p = document.createElement('div');
                p.className = 'mb-2 animate-in fade-in slide-in-from-left-2 duration-300';
                p.textContent = text;
                logsContainer.appendChild(p);
            }, delay);
        });

        setTimeout(() => {
            loadingScreen.classList.add('glitch-effect');
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                mainContent.classList.remove('hidden');
                mainContent.classList.add('animate-in', 'fade-in', 'duration-700');
            }, 800);
        }, 4000);

    </script>
</body>
</html>
