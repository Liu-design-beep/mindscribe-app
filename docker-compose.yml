version: '3.8'

services:
  backend:
    build:
      context: app/web
      dockerfile: Dockerfile
    container_name: lingji-backend
    ports:
      - "8000:8000"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - APP_ID=${APP_ID}
    volumes:
      - ./app/web/documents:/app/documents
      - ./app/web/vector_storage:/app/vector_storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: nginx:alpine
    container_name: lingji-frontend
    ports:
      - "8080:80"
    volumes:
      - ./app/frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - backend

